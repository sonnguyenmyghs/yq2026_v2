<!-- =====================================================================
     CHANGE PASSWORD — template PRODUCTION, thay cho template changepassword cũ
     Partial: layout của site đã in header, footer, jQuery, Bootstrap, style.css, account-production.js.
     Bản xem thử có dữ liệu mẫu: member/password.html (repo yq2026).
     Form POST về chính trang này, name/id giữ như template cũ:
       token, changepass[old] #pass_current, changepass[new] #pass_new, changepass[retype] #pass_confirm.
     Giữ khung cũ: mỗi ô một div.form-group + label.label + input.form-control, nút trong
     div.form-group.text--center với class button button--cta btn btn-primary; class yq-* chỉ thêm vào để lấy giao diện.
     Biến: token, lang.old_password, lang.new_password, lang.confirm_password, lang.change_my_password.
     KHÔNG có JS riêng: form POST thẳng, PHP kiểm tra. Nút con mắt dùng account-production.js của layout.
     Form không mang id pwForm để pages.js (bản demo) không bắt submit.
     ===================================================================== -->
<section class="yq-pagehead">
  <div class="yq-container">
    <div class="yq-eyebrow yq-eyebrow--gold">My account</div>
    <h1 class="yq-serif">Change Password</h1>
    <p class="yq-lead mb-0">Keep your account secure with a fresh password.</p>
  </div>
</section>

<section style="padding-bottom:clamp(56px,8vw,104px)">
  <div class="yq-container">
    <div class="yq-prof">

      <!-- Thẻ bảo mật (dính bên trái) -->
      <aside>
        <div class="yq-prof__card">
          <div class="yq-pw__shield" aria-hidden="true"><svg class="yq-i" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.2"/><path d="M8.5 10.5V7.8a3.5 3.5 0 0 1 7 0v2.7"/></svg></div>
          <h2 class="yq-prof__name">Account security</h2>
          <p class="yq-pw__lead">Pick something you do not use anywhere else. You stay signed in on this device after changing it.</p>
          <div class="yq-prof__links">
            <a class="yq-link-arrow" href="$_BASE/member/profile">Back to profile <svg class="yq-i" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg></a>
          </div>
        </div>
      </aside>

      <!-- Form đổi mật khẩu -->
      <div class="yq-prof__body">
      <section class="yq-prof__group">
        <header class="yq-prof__grouphead">
          <span class="yq-prof__groupico"><svg class="yq-i" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.2"/><path d="M8.5 10.5V7.8a3.5 3.5 0 0 1 7 0v2.7"/></svg></span>
          <h2 class="yq-prof__grouptitle">New password</h2>
        </header>
        <form class="yq-pw__form" method="POST">
          <input type="hidden" name="token" value="{$token}">
          <div class="form-group yq-pw__field">
            <label class="label yq-auth__label" for="pass_current">{$lang['old_password']}</label>
            <div class="yq-auth__pw"><input name="changepass[old]" id="pass_current" type="password" class="form-control yq-input" autocomplete="current-password"><button class="yq-auth__peek" type="button" data-yq-peek aria-label="Show password"><svg class="yq-i yq-auth__eye" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.9"/></svg><svg class="yq-i yq-auth__eyeoff" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5 20 20M9.6 6.9A9.6 9.6 0 0 1 12 6.5c6 0 9.5 5.5 9.5 5.5a17 17 0 0 1-3.4 3.9"/><path d="M6.4 8.2A16.6 16.6 0 0 0 2.5 12S6 17.5 12 17.5c1 0 1.9-.15 2.7-.4"/><path d="M9.9 9.9a2.9 2.9 0 0 0 4.1 4.1"/></svg></button></div>
          </div>
          <div class="form-group yq-pw__field">
            <label class="label yq-auth__label" for="pass_new">{$lang['new_password']}</label>
            <div class="yq-auth__pw"><input name="changepass[new]" id="pass_new" type="password" class="form-control yq-input" autocomplete="new-password"><button class="yq-auth__peek" type="button" data-yq-peek aria-label="Show password"><svg class="yq-i yq-auth__eye" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.9"/></svg><svg class="yq-i yq-auth__eyeoff" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5 20 20M9.6 6.9A9.6 9.6 0 0 1 12 6.5c6 0 9.5 5.5 9.5 5.5a17 17 0 0 1-3.4 3.9"/><path d="M6.4 8.2A16.6 16.6 0 0 0 2.5 12S6 17.5 12 17.5c1 0 1.9-.15 2.7-.4"/><path d="M9.9 9.9a2.9 2.9 0 0 0 4.1 4.1"/></svg></button></div>
          </div>
          <div class="form-group yq-pw__field">
            <label class="label yq-auth__label" for="pass_confirm">{$lang['confirm_password']}</label>
            <div class="yq-auth__pw"><input name="changepass[retype]" id="pass_confirm" type="password" class="form-control yq-input" autocomplete="new-password"><button class="yq-auth__peek" type="button" data-yq-peek aria-label="Show password"><svg class="yq-i yq-auth__eye" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.9"/></svg><svg class="yq-i yq-auth__eyeoff" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5 20 20M9.6 6.9A9.6 9.6 0 0 1 12 6.5c6 0 9.5 5.5 9.5 5.5a17 17 0 0 1-3.4 3.9"/><path d="M6.4 8.2A16.6 16.6 0 0 0 2.5 12S6 17.5 12 17.5c1 0 1.9-.15 2.7-.4"/><path d="M9.9 9.9a2.9 2.9 0 0 0 4.1 4.1"/></svg></button></div>
          </div>
          <div class="form-group text--center mt-2">
            <button type="submit" class="button button--cta button btn btn-primary yq-btn yq-btn--block yq-pw__submit">{$lang['change_my_password']}</button>
          </div>
        </form>
      </section>
      </div>

    </div>
  </div>
</section>
