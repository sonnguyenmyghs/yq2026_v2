<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Products — Grand Hyatt Singapore</title>
<meta name="description" content="Discover our curated collection of cakes, hampers, wines, and experiences from Grand Hyatt Singapore.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
<link href="assets/css/parts/nav.css" rel="stylesheet">
<link href="assets/css/parts/banner.css" rel="stylesheet">
<link href="assets/css/parts/buynow.css" rel="stylesheet">
<link href="assets/css/parts/cart-anim.css" rel="stylesheet">
</head>
<body>

<div id="gh-header"></div>

<section class="gh-pagehead">
  <div class="gh-container">
    <div class="gh-eyebrow gh-eyebrow--gold">Shop</div>
    <h1 class="gh-serif">All Products</h1>
    <p class="gh-lead mb-0">Discover our curated collection of cakes, hampers, wines, and experiences.</p>
  </div>
</section>

<section style="padding-bottom:clamp(56px,8vw,104px)">
  <div class="gh-container">

    <div class="gh-panel mb-4" style="padding:20px 22px">
      <div class="gh-filterbar" id="shopCats"></div>
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 pb-3" style="border-bottom:1px dashed var(--gh-line)">
        <span class="gh-results-count" id="shopCount">13 products</span>
        <select class="gh-select" id="shopSort" aria-label="Sort products">
          <option value="featured">Featured</option>
          <option value="new">Newest</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name">Name: A–Z</option>
        </select>
      </div>
      <div class="gh-seasonal">
        <span class="gh-seasonal__label">Seasonal:</span>
        <span id="shopSeasons" class="d-flex flex-wrap gap-2"></span>
      </div>
    </div>

    <div class="mb-3" id="shopQuery" style="display:none">
      <span class="gh-chip is-active">Search: <b></b>
        <span id="shopClearQuery" style="cursor:pointer;margin-left:4px">&times;</span>
      </span>
    </div>

    <div class="row g-4" id="shopGrid"></div>
  </div>
</section>

<div id="gh-footer"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages.js"></script>
<script src="assets/js/modules/nav.js"></script>
<script src="assets/js/modules/banner.js"></script>
<script src="assets/js/modules/buynow.js"></script>
<script src="assets/js/modules/cart-anim.js"></script>
<script>
  jQuery(function () {
    GH.renderHeader('shop');
    GH.renderFooter();
    GH.initShop();
  });
</script>
</body>
</html>
