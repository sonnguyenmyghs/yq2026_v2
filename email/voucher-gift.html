<!--
  EMAIL VOUCHER + E-CARD (gửi người nhận quà / người mua) — thiết kế "Luxe Ticket" (v2), đặc tả: email/DESIGN-TICKET.md
  Viết cho email client: chỉ <table> + style inline, không <style>/media query, không flex/grid/gradient/rgba/opacity/biến CSS/SVG/video.
  Rộng tối đa 640px (nội dung 592px), tự co trên điện thoại (width:100% + max-width). Dán vào trình soạn email của CMS (chế độ Source).
  Thứ tự (bản gọn v3): logo -> %gift_card% (lời chúc trên giấy kem + vé voucher ngang có cuống QR) -> nút "View your gift online"
          -> 1 câu cách dùng (số đặt bàn) -> dòng nhỏ "Purchased on … · Ref … · Terms apply" -> footer.
  Hướng dẫn chi tiết + điều khoản đầy đủ nằm ở trang gift (%gift_url%, %terms_url%), không nhồi vào email.
  Không còn "About the voucher" / %product_description% trong email (mô tả đầy đủ hiện ở trang voucher/gift.html).

  Biến CŨ (giữ nguyên tên):
    ở khung này: %redeem_date% (dòng "Purchased on")
    trong khối thiệp (parts/card-*.html, kể cả card-none): %product_name% %redeem_expiry% %voucher% %qr_code% %gift_message%
  Biến MỚI ở khung:
    %gift_card%            khối thiệp — backend chọn 1 file trong email/parts theo card_layout, thay biến rồi chèn vào đây:
                             card-classic | card-overlay | card-split | card-minimal; không có thiệp -> card-none
    %gift_url%             link https tuyệt đối trang mở quà /gift/<token> (voucher/gift.html) — gõ tay trong Source (nằm trong href)
    %preheader%            dòng xem trước trong hộp thư, vd "James sent you a gift from The Shop"
    %outlet_phone%         số đặt bàn của nhà hàng, vd "+65 6732 1234" (nằm cả trong href="tel:…" — gõ tay trong Source)
    %terms_url%            link điều khoản đầy đủ (có thể = %gift_url%#terms) — gõ tay trong Source
    %order_ref%            mã đơn hàng, vd "GH12345678"
  Bảng biến đầy đủ + cách áp dụng lên admin: email/README.md.
-->
<div style="margin:0;padding:0;background-color:#F6F4EF;">
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;overflow:hidden;color:#F6F4EF;mso-hide:all;">%preheader%</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F6F4EF" style="background-color:#F6F4EF;">
  <tr>
    <td align="center" style="padding:24px 10px;">

      <table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF" style="width:100%;max-width:640px;background-color:#FFFFFF;">

        <!-- Logo -->
        <tr>
          <td align="center" style="padding:28px 24px 24px;">
            <a href="https://ireward.superghs.com/yqhyattsgstore" target="_blank" style="text-decoration:none;">
              <img src="https://ireward.superghs.com/resource/yqhyattsgstore/newsletter/logoGHSIN.jpg" width="200" height="64" alt="Grand Hyatt Singapore" style="display:block;width:200px;max-width:100%;height:auto;border:0;">
            </a>
          </td>
        </tr>

        <!-- Lời chúc + vé voucher (khối thiệp) -->
        <tr>
          <td style="padding:0;">%gift_card%</td>
        </tr>

        <!-- Nút mở trang quà, cách vé 22px (bulletproof: bảng + nền màu, không cần ảnh) -->
        <tr>
          <td align="center" style="padding:22px 24px 0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto;">
              <tr>
                <td align="center" bgcolor="#171613" style="background-color:#171613;border-radius:24px;">
                  <a href="%gift_url%" target="_blank" style="display:inline-block;padding:14px 34px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:18px;font-weight:bold;letter-spacing:0.5px;color:#FFFFFF;text-decoration:none;border-radius:24px;">View your gift online</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Cách dùng (1 câu) + dòng nhỏ: ngày mua, mã đơn, link điều khoản -->
        <tr>
          <td align="center" style="padding:26px 40px 34px;text-align:center;">
            <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:21px;color:#3A342C;text-align:center;">Reserve at <a href="tel:%outlet_phone%" style="color:#171613;text-decoration:none;font-weight:bold;white-space:nowrap;">%outlet_phone%</a> and show the QR code on arrival.</p>
            <p style="margin:10px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:17px;color:#8A837A;text-align:center;">Purchased on %redeem_date% &middot; Ref %order_ref% &middot; <a href="%terms_url%" target="_blank" style="color:#8A837A;text-decoration:underline;">Terms apply</a></p>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td bgcolor="#171613" style="background-color:#171613;padding:24px 32px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:19px;color:#BDB6AA;" align="center">
            <span style="letter-spacing:3px;text-transform:uppercase;color:#FFFFFF;">The Shop&nbsp;· Grand&nbsp;Hyatt&nbsp;Singapore</span><br>
            Lobby Level, 10&#8203; Scotts&#8203; Road, Singapore&#8203; 228211<br>
            <a href="mailto:theshop.sg@hyatt.com" style="color:#BDB6AA;text-decoration:underline;">theshop.sg@hyatt.com</a> · <a href="tel:+6564167117" style="color:#BDB6AA;text-decoration:none;">+65 6416 7117</a>
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
</div>
