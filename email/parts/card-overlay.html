<!--
  Khối thiệp OVERLAY (ảnh làm nền, khung chữ màu đè ở dưới) — chèn vào %gift_card% của email/voucher-gift.html
  Biến: %card_bg% (#RRGGBB — card_colour_hex) · %card_banner_overlay% (URL https ảnh ĐÃ CẮT SẴN đúng 592x460px — xem dưới)
        %recipient_name% · %sender_name% · %gift_message% (đã escape, xuống dòng -> <br>)

  Vì sao viết thế này (caniemail):
  - Gmail web có thể XOÁ CẢ thuộc tính style nếu trong đó có url(). Nên url() chỉ nằm ở ô ảnh nền, ô đó không
    mang bố cục; khoảng cách / màu / bo góc nằm ở bảng lồng bên trong -> Gmail xoá style thì bố cục vẫn còn.
  - Ảnh nền còn được khai báo bằng thuộc tính HTML background (Gmail web, Apple Mail, Yahoo, Outlook.com, Outlook Mac).
    Thuộc tính này KHÔNG co giãn ảnh (hiện đúng kích thước gốc, lặp lại nếu ô cao hơn) -> ảnh phải cắt sẵn đúng 592x460 (1x).
  - Outlook Windows (bản Word) không hiện ảnh nền CSS: dùng VML trong comment điều kiện (mso-fit-shape-to-text để khung
    tự cao thêm khi lời nhắn dài). Nếu CMS xoá comment điều kiện -> Outlook chỉ hiện nền %card_bg% với khung chữ (vẫn đọc được).
  - Gmail app với tài khoản không phải Google: không có ảnh nền -> nền %card_bg%.
  - Ô ảnh nền KHÔNG có thuộc tính width (width=592 trên td sẽ ép bảng rộng 592px trên điện thoại).
  - Lời nhắn dài (300 ký tự) trên điện thoại làm ô cao hơn 460px: client có CSS cover thì vẫn đẹp; client chỉ có thuộc tính
    background thì ảnh lặp lại phía dưới. Chấp nhận được (chữ vẫn đọc được trên nền %card_bg%).
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="padding:0 24px;">
      <table role="presentation" width="592" cellpadding="0" cellspacing="0" border="0" bgcolor="%card_bg%" style="width:100%;max-width:592px;background-color:%card_bg%;">
        <tr>
          <td background="%card_banner_overlay%" bgcolor="%card_bg%" height="460" valign="bottom" style="background-color:%card_bg%;background-image:url(%card_banner_overlay%);background-position:center center;background-size:cover;background-repeat:no-repeat;">
            <!--[if gte mso 9]>
            <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:592px;height:460px;">
              <v:fill type="frame" src="%card_banner_overlay%" color="%card_bg%" />
              <v:textbox inset="0,0,0,0" style="mso-fit-shape-to-text:true;">
            <![endif]-->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td height="140" style="height:140px;line-height:140px;font-size:1px;">&nbsp;</td>
              </tr>
              <tr>
                <td style="padding:0 22px 22px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="%card_bg%" style="width:100%;background-color:%card_bg%;border-radius:10px;">
                    <tr>
                      <td style="padding:24px 28px 26px;">
                        <p style="margin:0 0 18px;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:16px;letter-spacing:3px;text-transform:uppercase;color:#FFFFFF;">The Shop &middot; A gift for you</p>
                        <p style="margin:0 0 12px;font-family:'Josefin Sans','Helvetica Neue',Arial,Helvetica,sans-serif;font-size:22px;line-height:30px;font-weight:600;color:#FFFFFF;">Dear %recipient_name%,</p>
                        <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:26px;color:#FFFFFF;text-align:left;">%gift_message%</p>
                        <p style="margin:18px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;color:#FFFFFF;text-align:right;">With love, <strong>%sender_name%</strong></p>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
            <!--[if gte mso 9]>
              </v:textbox>
            </v:rect>
            <![endif]-->
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
