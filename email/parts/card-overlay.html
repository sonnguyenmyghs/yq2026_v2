<!--
  Khối thiệp OVERLAY — "Luxe Voucher" (v3, một khối liền) — chèn vào %gift_card% của email/voucher-gift.html
  Cả thiệp là MỘT tấm voucher: nền %card_bg% (bo 10px, padding 10px) -> khung vàng 1px #C8A96A (bo 6px, rộng trong 570px) chứa:
    1. Lời chúc: ảnh làm nền ô 546x420 (%card_banner_overlay% ĐÃ CẮT SẴN đúng 546x420 @1x — thuộc tính background không co giãn) + hộp màu thiệp đè dưới; Outlook Windows: VML; mất ảnh nền -> nền %card_bg% (vẫn đọc được). Gmail web có thể xoá style có url() -> url() chỉ nằm ở ô ảnh nền, bố cục ở bảng lồng.
    2. Đường xé vé: nét đứt 1px %card_line%
    3. Voucher: chính (%outlet_name% · GIFT VOUCHER, %product_name%, %voucher_summary%, VALID UNTIL %redeem_expiry%)
       + cuống kem #F7F1E6 chứa %qr_code% (img 120px trên ô trắng), %voucher%, SCAN TO REDEEM. Hybrid 2 cột, điện thoại xếp chồng.
  Biến: %card_bg% %card_line% %recipient_name% %sender_name% %gift_message% (đã escape, xuống dòng -> <br>) %gift_url%
        %outlet_name% %product_name% %voucher_summary% %redeem_expiry% %qr_code% %voucher% + ảnh theo layout.
  Chữ trên nền thiệp: trắng #FFFFFF + vàng nhạt #E7D3A3 (màu thiệp luôn đủ tương phản với trắng — checkout tự làm tối màu Auto).
  Chỉ <table> + style inline (email-safe), xem email/DESIGN-TICKET.md.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="padding:0 24px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="%card_bg%" style="width:100%;background-color:%card_bg%;border-radius:10px;">
        <tr>
          <td style="padding:10px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border:1px solid #C8A96A;border-radius:6px;">
              <tr>
                <td style="padding:12px 12px 0;">
                  <table role="presentation" width="546" cellpadding="0" cellspacing="0" border="0" bgcolor="%card_bg%" style="width:100%;max-width:546px;background-color:%card_bg%;">
                    <tr>
                      <td background="%card_banner_overlay%" bgcolor="%card_bg%" height="420" valign="bottom" style="background-color:%card_bg%;background-image:url(%card_banner_overlay%);background-position:center center;background-size:cover;background-repeat:no-repeat;">
                        <!--[if gte mso 9]>
                        <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:546px;height:420px;">
                          <v:fill type="frame" src="%card_banner_overlay%" color="%card_bg%" />
                          <v:textbox inset="0,0,0,0" style="mso-fit-shape-to-text:true;">
                        <![endif]-->
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                          <tr>
                            <td height="140" style="height:140px;line-height:140px;font-size:1px;">&nbsp;</td>
                          </tr>
                          <tr>
                            <td style="padding:0 18px 18px;">
                              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="%card_bg%" style="width:100%;background-color:%card_bg%;border-radius:4px;">
                                <tr>
                                  <td style="padding:24px 26px;text-align:left;">
                    <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:10px;line-height:14px;letter-spacing:3px;text-transform:uppercase;color:#E7D3A3;text-align:left;">A gift for you</p>
                    <p style="margin:14px 0 0;font-family:Georgia,'Times New Roman',Times,serif;font-size:26px;line-height:32px;font-style:italic;font-weight:normal;color:#FFFFFF;text-align:left;">Dear %recipient_name%,</p>
                    <p style="margin:12px 0 0;font-family:Georgia,'Times New Roman',Times,serif;font-size:17px;line-height:28px;color:#FFFFFF;text-align:left;">%gift_message%</p>
                    <p style="margin:18px 0 0;font-family:Georgia,'Times New Roman',Times,serif;font-size:16px;line-height:22px;font-style:italic;color:#E7D3A3;text-align:right;">&mdash; With love, %sender_name%</p>
                                  </td>
                                </tr>
                              </table>
                            </td>
                          </tr>
                        </table>
                        <!--[if gte mso 9]>
                          </v:textbox>
                        </v:rect>
                        <![endif]-->
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <!-- Đường xé vé: nét đứt %card_line% nối lời chúc với phần voucher -->
              <tr>
                <td style="padding:18px 20px 0;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td height="1" style="height:1px;border-top:1px dashed %card_line%;font-size:1px;line-height:1px;mso-line-height-rule:exactly;">&nbsp;</td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td align="center" valign="middle" style="padding:10px 20px 16px;font-size:0;line-height:0;text-align:center;">
                  <!--[if mso]><table role="presentation" width="530" cellpadding="0" cellspacing="0" border="0" align="center"><tr><td width="360" valign="middle"><![endif]-->
                  <div style="display:inline-block;width:100%;max-width:360px;vertical-align:middle;text-align:left;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="padding:10px 20px 10px 0;text-align:left;">
                          <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:10px;line-height:14px;letter-spacing:3px;text-transform:uppercase;color:#E7D3A3;">%outlet_name%&nbsp;&middot; Gift&nbsp;voucher</p>
                          <p style="margin:12px 0 0;font-family:Georgia,'Times New Roman',Times,serif;font-size:26px;line-height:32px;font-weight:normal;color:#FFFFFF;">%product_name%</p>
                          <p style="margin:12px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#FFFFFF;">%voucher_summary%</p>
                          <p style="margin:10px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:16px;letter-spacing:1.5px;text-transform:uppercase;color:#E7D3A3;">Valid until %redeem_expiry%</p>
                        </td>
                      </tr>
                    </table>
                  </div>
                  <!--[if mso]></td><td width="170" valign="middle"><![endif]-->
                  <div style="display:inline-block;width:100%;max-width:170px;vertical-align:middle;text-align:center;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="center" style="padding:10px 0;text-align:center;">
                          <!-- Cuống vé: giấy kem, QR luôn trên ô trắng (không co: 120px cố định) -->
                          <table role="presentation" width="170" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="#F7F1E6" style="width:170px;margin:0 auto;background-color:#F7F1E6;border-radius:6px;">
                            <tr>
                              <td align="center" style="padding:14px;text-align:center;">
                                <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto;">
                                  <tr>
                                    <td bgcolor="#FFFFFF" style="padding:8px;background-color:#FFFFFF;">%qr_code%</td>
                                  </tr>
                                </table>
                                <p style="margin:12px 0 0;font-family:'Courier New',Courier,monospace;font-size:14px;line-height:18px;font-weight:bold;letter-spacing:2px;color:#171613;text-align:center;-webkit-text-size-adjust:none;">%voucher%</p>
                                <p style="margin:4px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:9px;line-height:14px;letter-spacing:2px;text-transform:uppercase;color:#8A837A;text-align:center;">Scan to redeem</p>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>
                  </div>
                  <!--[if mso]></td></tr></table><![endif]-->
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
