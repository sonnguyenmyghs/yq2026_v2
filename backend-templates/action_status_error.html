<!-- $status (lỗi): PHP in vào khung .yq-status-zone ở đầu trang chi tiết.
     Giữ class cũ action_status + status_error và data-message. Style: assets/css/parts/status.css -->
<div class="action_status status_error" data-message="$message" role="alert">
    <span class="action_status__icon" aria-hidden="true"></span>
    <div class="action_status__text">$message</div>
    <button type="button" class="action_status__close" aria-label="Close">&times;</button>
</div>
