<!-- Response của POST @base/search/?product_name=@keyword (search.js): HTML này thay nguyên nội dung #yqSearchResults.
     Có kết quả: in head + list. Không có: chỉ in .yq-sres__empty. Giá sale thêm <s>giá gốc</s>. Style: assets/css/parts/nav.css (mục 7b) -->
{if $arrSuggestion}
<div class="yq-sres__head"><span class="yq-search__label">Products</span><a class="yq-link-arrow" href="{$_BASE}/search/?product_name={$keyword|escape:'url'}">View all <svg class="yq-i" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15"/><polyline points="13 6 19 12 13 18"/></svg></a></div>
<ul class="yq-sres__list">
    {foreach $arrSuggestion as $item}
    <li class="yq-sres__item"><a class="yq-sres__link" href="{$item.link}"><span class="yq-sres__img"><img src="{$item.image}" alt="" loading="lazy" decoding="async"></span><span class="yq-sres__body"><span class="yq-sres__cat">{$item.category}</span><span class="yq-sres__name">{$item.name}</span></span><span class="yq-sres__price">{$item.price}{if $item.price_old}<s>{$item.price_old}</s>{/if}</span></a></li>
    {/foreach}
</ul>
{else}
<p class="yq-sres__empty">No products found for “<b>{$keyword|escape}</b>”. Try another keyword.</p>
{/if}
